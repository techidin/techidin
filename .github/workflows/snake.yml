# Draws the contribution graph as a snake animation and publishes the SVGs to
# the `output` branch, which README.md embeds. GitHub serves the files itself,
# so the image never depends on an external stats service. ahmadmuhyidin-snake.svg
# uses the personal site's lime palette (ink snake; gridline, lime 200, mint, lime and
# deep green dots, matching the site's heatmap) for its home page.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, 07:00 WIB
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ahmadmuhyidin-snake.svg?color_snake=#161c10&color_dots=#eef0e7,#d9f99d,#bef264,#84cc16,#426212

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
